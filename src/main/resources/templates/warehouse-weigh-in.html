<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Warehouse Weigh-In</title>
    <style>
        body { font-family: Arial; background-color: #333; color: white; text-align: center; padding: 50px; }
        .box { background: #000; padding: 40px; border-radius: 10px; max-width: 500px; margin: 0 auto; border: 2px solid #FFD100; }
        input { width: 80%; padding: 20px; font-size: 32px; text-align: center; margin: 20px 0; border-radius: 5px; border: none; }
        .btn { background: #FFD100; color: black; padding: 20px; font-size: 24px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; width: 100%; }
    </style>
</head>
<body>
<div class="box">
    <h1 style="color: #FFD100;">Sorting Station</h1>
    <h3>Order ID: <span th:text="${order.id}"></span></h3>
    <p>Place parcel on the scale.</p>

    <form th:action="@{/warehouse/scan/{id}(id=${order.id})}" method="post">
        <label style="font-size: 20px;">Exact Weight (kg):</label><br>
        <input type="number" step="0.1" name="weight" required autofocus>

        <button type="submit" class="btn">Generate Price & QR</button>
    </form>
</div>
</body>
</html>
