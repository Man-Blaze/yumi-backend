<!DOCTYPE html>
<html>
<head>
    <title>Login - YumiExpress</title>
    <style>
        body { font-family: Arial; background-color: #FFD100; padding: 50px; }
        .box { background: white; padding: 30px; border-radius: 10px; max-width: 400px; margin: 0 auto; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .btn { background: black; color: #FFD100; padding: 15px; width: 100%; border: none; font-weight: bold; font-size: 18px; cursor: pointer; border-radius: 5px; margin-top: 10px;}
    </style>
</head>
<body>
<div class="box">
    <h2>Customer Login</h2>

    <form action="/process-login" method="post">
        <label>Phone Number:</label>
        <input type="text" name="phoneNumber" required>

        <label>National ID Number:</label>
        <input type="text" name="nationalId" required>

        <button type="submit" class="btn">Login</button>
    </form>

    <p style="text-align: center; margin-top: 20px; font-size: 14px;">
        New here? <a href="/register" style="color: black; font-weight: bold;">Register here</a>
    </p>
</div>
</body>
</html>
