</html><!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Rider Dashboard</title>
    <style>
        body { font-family: Arial; background-color: #FFD100; padding: 20px; margin: 0; }
        .header { background: black; color: #FFD100; padding: 20px; text-align: center; border-radius: 10px 10px 0 0; max-width: 600px; margin: 0 auto; }
        .container { background: white; padding: 20px; border-radius: 0 0 10px 10px; max-width: 600px; margin: 0 auto; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        .card { border: 2px solid #000; padding: 15px; margin-bottom: 15px; border-radius: 5px; }
        .btn { background: black; color: #FFD100; padding: 10px 15px; text-decoration: none; font-weight: bold; border-radius: 5px; display: inline-block; margin-top: 10px; }
        .status { background: #FFD100; padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>
<div class="header">
    <h1>YumiExpress Rider</h1>
    <h2 th:text="${rider.fullName}">Rider Name</h2>
</div>

<div class="container">
    <h3>Your Assigned Tasks</h3>

    <div th:if="${#lists.isEmpty(tasks)}">
        <p>You have no tasks right now. Enjoy your break!</p>
    </div>

    <!-- Loop through all tasks assigned to this rider -->
    <div class="card" th:each="task : ${tasks}">
        <p><strong>Order ID:</strong> <span th:text="${task.id}"></span></p>
        <p><strong>Pickup:</strong> <span th:text="${task.pickupAddress}"></span></p>
        <p><strong>Weight:</strong> <span th:text="${task.weightInKg}"></span> kg</p>
        <p><strong>Price:</strong> <span th:text="${task.price}"></span> VT</p>
        <p><strong>Status:</strong> <span class="status" th:text="${task.status}"></span></p>

        <!-- Action Buttons based on status -->
        <a th:if="${task.status == 'ASSIGNED'}" th:href="@{/rider/update-status/{id}(id=${task.id}, status='PICKED_UP')}" class="btn">Mark as Picked Up</a>

        <a th:if="${task.status == 'PICKED_UP'}" th:href="@{/rider/update-status/{id}(id=${task.id}, status='DELIVERED')}" class="btn" style="background: #00A651;">Mark as Delivered</a>
    </div>
</div>
</body>
</html>
