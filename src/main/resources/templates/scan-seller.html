<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan Seller Barcode</title>
    <style>
        body { font-family: Arial; background-color: #222; color: white; text-align: center; padding: 50px; margin: 0; }
        .box { background: #000; padding: 40px; border-radius: 10px; max-width: 500px; margin: 0 auto; border: 3px solid #FFD100; }
        input, select { width: 90%; padding: 15px; font-size: 18px; margin: 10px 0; border-radius: 5px; border: none; }
        .btn { background: #FFD100; color: black; padding: 15px; font-size: 20px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 20px;}
    </style>
</head>
<body>
<div class="box">
    <h1 style="color: #FFD100;">📷 Scan Seller Barcode</h1>
    <p>Order ID: <span th:text="${order.id}"></span></p>

    <form th:action="@{/admin/scan-seller-barcode/{id}(id=${order.id})}" method="post">
        <label style="text-align: left; display: block;">Seller Barcode:</label>
        <input type="text" name="sellerBarcode" required autofocus placeholder="e.g., JOSS-9912">

        <label style="text-align: left; display: block; margin-top: 10px;">Receiver Address:</label>
        <input type="text" name="receiverAddress" required placeholder="e.g., Mele Village">
        <label style="text-align: left; display: block; margin-top: 10px;">Recipient Phone Number:</label>
        <input type="text" name="recipientPhone" required placeholder="e.g., 5551234">

        <label style="text-align: left; display: block; margin-top: 10px;">Specific Details (Landmark/Family):</label>
        <input type="text" name="specificAddressDetails" required placeholder="e.g., Blue house behind the church">

        <label style="text-align: left; display: block; margin-top: 10px;">Delivery Zone:</label>
        <select name="zone" required>
            <option value="CENTRAL">Central Port Vila</option>
            <option value="NORTHERN">Northern Ward (Tagabe)</option>
            <option value="SOUTHERN">Southern Ward (Mele, Pango)</option>
            <option value="RURAL">Rural Efate</option>
        </select>

        <button type="submit" class="btn">Register & Generate YumiExpress QR</button>
    </form>
</div>
</body>
</html>
