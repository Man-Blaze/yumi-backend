<!DOCTYPE html>
<html>
<head>
    <title>Rider Registration - YumiExpress Admin</title>
    <style>
        body { font-family: Arial; background-color: #FFD100; padding: 50px; }
        .box { background: white; padding: 30px; border-radius: 10px; max-width: 400px; margin: 0 auto; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        input, select { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .btn { background: black; color: #FFD100; padding: 15px; width: 100%; border: none; font-weight: bold; font-size: 18px; cursor: pointer; border-radius: 5px; margin-top: 10px;}
        .admin-badge { background: #E30613; color: white; padding: 5px 10px; border-radius: 5px; font-size: 12px; font-weight: bold; display: inline-block; margin-bottom: 10px;}
    </style>
</head>
<body>
<div class="box">
    <div class="admin-badge">ADMIN ONLY</div>
    <h2>Onboard New Rider</h2>
    <p style="font-size: 12px; color: #555;">Verify the rider's National ID and register their vehicle.</p>

    <form action="/process-register" method="post">
        <!-- Force the role to be RIDER -->
        <input type="hidden" name="role" value="RIDER">

        <label>Full Name:</label>
        <input type="text" name="fullName" required>

        <label>Phone Number:</label>
        <input type="text" name="phoneNumber" required>

        <label>National ID Number:</label>
        <input type="text" name="nationalId" required>

        <label>Home Area / Village:</label>
        <input type="text" name="area" required placeholder="e.g., Tagabe, Black Sand">

        <!-- NEW: Vehicle Selection -->
        <label>Vehicle Type:</label>
        <select name="vehicleType" required>
            <option value="OWN_SCOOTER">Rider's Own Scooter (Pay: 350 VT/delivery)</option>
            <option value="COMPANY_SCOOTER">Company Scooter (Pay: 150 VT/delivery)</option>
            <option value="COMPANY_TRUCK">Company Pickup Truck</option>
        </select>

        <button type="submit" class="btn">Register Rider</button>
    </form>
</div>
</body>
</html>
