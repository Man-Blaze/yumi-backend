<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Load Parcels - YumiExpress</title>
    <style>
        body { font-family: Arial; background-color: #222; color: white; text-align: center; padding: 20px; margin: 0; }
        .box { background: #000; padding: 30px; border-radius: 10px; max-width: 400px; margin: 0 auto; border: 3px solid #FFD100; }
        input { width: 90%; padding: 15px; font-size: 20px; margin: 15px 0; border-radius: 5px; border: none; text-align: center;}
        .btn { background: #FFD100; color: black; padding: 15px; font-size: 20px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; width: 100%; }
        .success { color: #00A651; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>
<div class="box">
    <h1 style="color: #FFD100;">Load Your Bag</h1>
    <p>Rider: <span th:text="${rider.fullName}"></span></p>
    <p>Scan the YumiExpress QR code on the parcel.</p>

    <form th:action="@{/rider/load-parcel/{riderId}(riderId=${rider.id})}" method="post">
        <input type="text" name="trackingId" required autofocus placeholder="Scan QR or Enter YE-XXXXX">
        <button type="submit" class="btn">Add to Bag</button>
    </form>

    <div th:if="${message}" class="success" th:text="${message}"></div>
</div>
</body>
</html>
