<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warehouse Scanning Station</title>
    <style>
        body { font-family: Arial; background-color: #222; color: white; text-align: center; padding: 50px; margin: 0; }
        .box { background: #000; padding: 40px; border-radius: 10px; max-width: 500px; margin: 0 auto; border: 3px solid #FFD100; box-shadow: 0 0 20px rgba(255, 209, 0, 0.3);}
        h1 { color: #FFD100; font-size: 36px; margin-top: 0;}
        input { width: 80%; padding: 20px; font-size: 32px; text-align: center; margin: 20px 0; border-radius: 5px; border: none; }
        .btn { background: #FFD100; color: black; padding: 20px; font-size: 24px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; width: 100%; }
        .btn:hover { background: #e6bd00; }
        .info { color: #aaa; font-size: 14px; }
        .empty-state { font-size: 24px; color: #00A651; font-weight: bold;}
    </style>
</head>
<body>
<div class="box">
    <h1>📦 Sorting Station</h1>

    <!-- If there are no more parcels to scan -->
    <div th:if="${order == null}" class="empty-state">
        ✅ All parcels have been scanned and sorted!
        <br><br>
        <a href="/admin-portal" style="color: #FFD100; text-decoration: none;">← Back to Admin Portal</a>
    </div>

    <!-- If there is a parcel to scan -->
    <div th:if="${order != null}">
        <p class="info">Scanning Parcel ID: <span th:text="${order.id}"></span></p>
        <p class="info">Seller: <span th:text="${order.pickupAddress}"></span></p>

        <form th:action="@{/warehouse/scan}" method="post">
            <input type="hidden" name="orderId" th:value="${order.id}">

            <label style="font-size: 20px; font-weight: bold;">Place on Scale - Enter Weight (kg):</label><br>
            <input type="number" step="0.1" name="weight" required autofocus placeholder="0.0">

            <button type="submit" class="btn">Generate Price & QR ➔</button>
        </form>
    </div>
</div>
</body>
</html>
